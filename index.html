<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Goodwin Photography — Corporate, Events &amp; Landscape Photography</title>
    <meta
      name="description"
      content="Sam Goodwin is an editorial photographer based in Queensland, Australia, shooting corporate, events and landscape photography across Australia and New Zealand."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form for Netlify's build-time form-detection bot. It scans the
      raw deployed HTML (not client-rendered content) for a form with the
      `netlify` attribute to learn the field schema — this one is never
      shown to visitors. The real, visible form is the React one in
      src/components/ContactForm.jsx, which posts to "/" with a matching
      form-name so Netlify treats the submission as belonging to this form.
    -->
    <form name="contact" netlify netlify-honeypot="botcheck" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="botcheck" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
